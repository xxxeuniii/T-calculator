server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /trade-tool/;
    }

    location = /trade-tool {
        return 302 /trade-tool/;
    }

    location = /trade-tool/service-worker.js {
        rewrite ^/trade-tool/(.*)$ /$1 break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /trade-tool/index.html {
        rewrite ^/trade-tool/(.*)$ /$1 break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /trade-tool/_expo/ {
        rewrite ^/trade-tool/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /trade-tool/ {
        rewrite ^/trade-tool/(.*)$ /$1 break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
