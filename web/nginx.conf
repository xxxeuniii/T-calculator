server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /t-calculator/;
    }

    location /t-calculator/ {
        alias /usr/share/nginx/html/t-calculator/;
        try_files $uri $uri/ /t-calculator/index.html;
    }
}