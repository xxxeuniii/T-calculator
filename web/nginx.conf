server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /trade-tool/;
    }

    location = /trade-tool {
        return 302 /trade-tool/;
    }

    location ^~ /trade-tool/ {
        rewrite ^/trade-tool/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
